# A library whose entire claim is "the convergence property is actually tested"
# has to run those tests where anyone can see the result.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines; the others are what
        # people are actually on.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # There is one devDependency — `ws`, for the tests that use a real socket
      # rather than one of mine. Without it those tests skip themselves with a
      # reason, which is right for a contributor who has not installed anything
      # and wrong here: skipping quietly is how a suite stops testing the thing
      # it was written for.
      - run: npm ci

      # So the runtime claim is checked rather than asserted. The published
      # package must have no dependencies at all; this fails if one appears.
      - name: the package itself has no dependencies
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          echo "runtime dependencies: $count"
          test "$count" -eq 0

      - run: npm test

      # And that the real-socket tests actually ran, rather than skipping.
      - name: no test may have been skipped
        run: |
          skipped=$(npm test 2>&1 | grep -oE '^# skipped [0-9]+' | grep -oE '[0-9]+')
          echo "skipped: $skipped"
          test "$skipped" -eq 0
